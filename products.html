<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SHOP - CRITZ</title>
<style>
:root{--red:#e10600;--black:#000}
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;-webkit-tap-highlight-color:transparent}
body{background:#000;color:#fff;overflow-x:hidden}
body.no-scroll{overflow:hidden}

header{position:fixed;top:0;width:100%;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;z-index:10;background:#000;border-bottom:1px solid #1a1a1a}
.logo{font-size:20px;font-weight:900}.logo span{color:var(--red)}
.nav{display:flex;gap:16px}.nav a{color:#fff;text-decoration:none;font-size:11px;font-weight:800;letter-spacing:1px}

/* 2 PER ROW */
.products{padding:64px 10px 30px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.product-card{background:#0e0e0e;border:1px solid #1e1e1e;border-radius:16px;overflow:hidden;text-align:center}
.product-card img{width:100%;height:140px;object-fit:contain;background:#fff;display:block;padding:8px}
.product-card h3{font-size:10px;margin:12px 8px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.price{color:var(--red);font-size:14px;font-weight:900;margin-bottom:10px}
.view-btn{width:calc(100% - 16px);background:var(--red);color:#fff;border:none;padding:11px;border-radius:8px;font-size:11px;font-weight:900;margin:0 8px 10px;letter-spacing:0.8px}

/* DRAWER */
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:999;opacity:0;visibility:hidden;transition:0.3s}
.drawer-overlay.active{opacity:1;visibility:visible}
.drawer{position:fixed;bottom:-100%;left:0;width:100%;height:92vh;background:#000;z-index:1000;transition:bottom 0.4s cubic-bezier(0.32,0.72,0,1);border-radius:16px 16px 0 0;display:flex;flex-direction:column}
.drawer.active{bottom:0}
.drawer-top{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;background:#000;border-bottom:1px solid #111}
.drawer-top h3{font-size:11px;letter-spacing:2.5px;color:#888;font-weight:800}
.close-x{width:38px;height:38px;border-radius:50%;background:#1a1a1a;border:none;color:#fff;font-size:22px;display:grid;place-items:center}

/* MULTIPLE PICTURES SWIPE */
.drawer-img-wrap{background:#fff;width:100%;height:40vh;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth}
.drawer-img-wrap::-webkit-scrollbar{display:none}
.drawer-img-wrap img{width:100%;min-width:100%;height:100%;object-fit:contain;background:#fff;scroll-snap-align:center}
.dots-wrap{display:flex;gap:6px;justify-content:center;padding:10px 0;background:#000}
.dot{width:6px;height:6px;border-radius:50%;background:#333;transition:0.2s}
.dot.active{background:#fff;width:18px}

.drawer-content{background:#000;padding:14px 16px;flex:1;overflow-y:auto}
.drawer-content h2{font-size:19px;font-weight:900;margin-bottom:4px}
.d-price{color:var(--red);font-size:17px;font-weight:900;margin-bottom:16px}
.opt-title{font-size:11px;letter-spacing:2px;color:#888;margin-bottom:10px;font-weight:700}
.sizes{display:flex;gap:10px;margin-bottom:18px}
.size-btn{padding:12px 18px;min-width:52px;border:1px solid #333;background:transparent;color:#fff;border-radius:10px;font-weight:800;font-size:13px}
.size-btn.active{background:#fff;color:#000;border-color:#fff}
.qty-box{display:flex;align-items:center;background:#111;border:1px solid #222;border-radius:12px;width:160px;overflow:hidden;margin-bottom:20px}
.qty-btn{width:54px;height:46px;background:#1a1a1a;border:none;color:#fff;font-size:20px}
.qty-num{flex:1;text-align:center;font-weight:900;font-size:15px}
.btn-stack{display:flex;flex-direction:column;gap:10px;padding-bottom:env(safe-area-inset-bottom)}
.btn-big{width:100%;padding:16px;border:none;border-radius:12px;font-weight:900;font-size:12px;letter-spacing:1px}
.btn-cart{background:#fff;color:#000}
.btn-buy{background:var(--red);color:#fff}

@media(min-width:768px){
.products{grid-template-columns:repeat(3,1fr);gap:20px;padding:90px 40px}
.product-card img{height:200px}
.drawer{width:420px;left:auto;right:-100%;bottom:0;height:100%;border-radius:0;transition:right 0.4s}
.drawer.active{right:0;bottom:0}
.drawer-img-wrap{height:50vh}
}
</style>
</head>
<body>
<header><div class="logo">CRI<span>TZ</span></div><div class="nav"><a href="index.html">HOME</a><a href="products.html">SHOP</a><a href="cart.html">🛍️ CART</a></div></header>

<section class="products">
  <div class="product-card"><img src="longsleeve.png" onclick="openDrawer('longsleeve')"><h3>LONG SLEEVE TEE</h3><div class="price">₦35,000</div><button class="view-btn" onclick="openDrawer('longsleeve')">VIEW</button></div>
  <div class="product-card"><img src="hoodie.png" onclick="openDrawer('hoodie')"><h3>CRITZ HOODIE</h3><div class="price">₦40,000</div><button class="view-btn" onclick="openDrawer('hoodie')">VIEW</button></div>
  <div class="product-card"><img src="harmlesstee.png" onclick="openDrawer('sleeveless')"><h3>GRAPHIC SLEEVELESS TEE</h3><div class="price">₦25,000</div><button class="view-btn" onclick="openDrawer('sleeveless')">VIEW</button></div>
  <div class="product-card"><img src="longsleeve.png" onclick="openDrawer('longsleeve')"><h3>LONG SLEEVE TEE</h3><div class="price">₦35,000</div><button class="view-btn" onclick="openDrawer('longsleeve')">VIEW</button></div>
</section>

<div class="drawer-overlay" id="overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-top"><h3>SELECT OPTIONS</h3><button class="close-x" onclick="closeDrawer()">✕</button></div>
  <div class="drawer-img-wrap" id="drawer-images"></div>
  <div class="dots-wrap" id="dots"></div>
  <div class="drawer-content">
    <h2 id="drawer-title"></h2>
    <div class="d-price" id="drawer-price"></div>
    <div class="opt-title" id="size-label">SIZE: M</div>
    <div class="sizes" id="size-options"></div>
    <div class="qty-box"><button class="qty-btn" onclick="changeQty(-1)">−</button><div class="qty-num" id="qty">1</div><button class="qty-btn" onclick="changeQty(1)">+</button></div>
    <div class="btn-stack">
      <button class="btn-big btn-cart" onclick="addToCartFromDrawer()">ADD TO CART</button>
      <button class="btn-big btn-buy" onclick="buyNow()">BUY IT NOW</button>
    </div>
  </div>
</div>

<script>
const products={
  longsleeve:{
    title:"LONG SLEEVE TEE",
    price:35000,
    images:["longsleeve.png","longsleeve-back.png","longsleeve-detail.png"],
    sizes:["M","L","XL","XXL"]
  },
  hoodie:{
    title:"CRITZ HOODIE",
    price:40000,
    images:["hoodie.png","hoodie-back.png","hoodie-side.png"],
    sizes:["M","L","XL","XXL"]
  },
  sleeveless:{
    title:"GRAPHIC SLEEVELESS TEE",
    price:25000,
    images:["harmlesstee.png","harmlesstee-back.png"],
    sizes:["M","L","XL"]
  }
};

let currentProduct=null,selectedSize=null,qty=1;

function openDrawer(id){
 currentProduct=products[id];
 selectedSize=currentProduct.sizes[0];
 qty=1;
 document.getElementById('drawer-title').innerText=currentProduct.title;
 document.getElementById('drawer-price').innerText=`₦${currentProduct.price.toLocaleString()}.00`;
 document.getElementById('qty').innerText=qty;

 const imgDiv=document.getElementById('drawer-images');
 imgDiv.innerHTML='';
 currentProduct.images.forEach(img=>{
   imgDiv.innerHTML+=`<img src="${img}" onerror="this.src='https://via.placeholder.com/600x600/ffffff/000000?text=CRITZ'">`;
 });

 const dotsDiv=document.getElementById('dots');
 dotsDiv.innerHTML='';
 currentProduct.images.forEach((_,k)=>{
   dotsDiv.innerHTML+=`<div class="dot ${k===0?'active':''}"></div>`;
 });

 imgDiv.onscroll = () => {
   let index = Math.round(imgDiv.scrollLeft / imgDiv.clientWidth);
   document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active', i===index));
 };

 const sizeDiv=document.getElementById('size-options');
 sizeDiv.innerHTML='';
 currentProduct.sizes.forEach((s,i)=>{
   sizeDiv.innerHTML+=`<button class="size-btn ${i===0?'active':''}" onclick="selectSize('${s}',this)">${s}</button>`;
 });
 document.getElementById('size-label').innerText=`SIZE: ${selectedSize}`;
 document.body.classList.add('no-scroll');
 document.getElementById('overlay').classList.add('active');
 document.getElementById('drawer').classList.add('active');
}
function closeDrawer(){document.body.classList.remove('no-scroll');document.getElementById('overlay').classList.remove('active');document.getElementById('drawer').classList.remove('active')}
function selectSize(s,el){selectedSize=s;document.querySelectorAll('.size-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');document.getElementById('size-label').innerText=`SIZE: ${selectedSize}`}
function changeQty(v){qty=Math.max(1,qty+v);document.getElementById('qty').innerText=qty}
function addToCartFromDrawer(){let cart=JSON.parse(localStorage.getItem('stylevaultCart'))||[];let key=currentProduct.title+'-'+selectedSize;let ex=cart.find(i=>i.key===key);if(ex)ex.qty+=qty;else cart.push({key,name:currentProduct.title,size:selectedSize,price:currentProduct.price,img:currentProduct.images[0],qty});localStorage.setItem('stylevaultCart',JSON.stringify(cart));closeDrawer()}
function buyNow(){addToCartFromDrawer();setTimeout(()=>location.href='cart.html',200)}
</script>
</body>
</html>
