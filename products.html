<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>SHOP - CRITZ</title>
<style>
:root{--red:#e10600}
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden}
body{
  background:#000 url('https://i.pinimg.com/1200x/c6/f5/71/c6f571c6e70de06b3485e3fb833f615d.jpg') no-repeat center center fixed;
  background-size:cover;color:#fff;
}
body::before{content:"";position:fixed;inset:0;background:rgba(0,0,0,0.68);z-index:-1}
body.no-scroll{overflow:hidden}

/* HOME NAV - GLASSY */
header{
  position:fixed;top:0;width:100%;padding:12px 14px;
  display:flex;justify-content:space-between;align-items:center;z-index:20;
  background:rgba(0,0,0,0.45);backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(255,255,255,0.12);
}
.logo{font-size:18px;font-weight:900;letter-spacing:1px}.logo span{color:var(--red)}
.nav{display:flex;gap:12px;align-items:center}
.nav a{color:rgba(255,255,255,0.85);text-decoration:none;font-size:10px;font-weight:800;letter-spacing:0.5px;padding:6px 4px}
.nav a.active{color:#fff;border-bottom:1px solid var(--red)}
.cart-badge{background:var(--red);color:#fff;font-size:9px;padding:2px 5px;border-radius:10px;margin-left:3px;font-weight:900}

/* PRODUCTS GRID - PERFECT FIT */
.products{
  padding:70px 10px 30px;
  display:grid;grid-template-columns:repeat(2,1fr);
  gap:10px;max-width:1400px;margin:0 auto;position:relative;z-index:1;
}
.product-card{
  background:rgba(15,15,15,0.50);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,0.15);
  border-radius:14px;overflow:hidden;text-align:center;
  display:flex;flex-direction:column;
  box-shadow:0 8px 32px rgba(0,0,0,0.5);
}
.img-wrap{
  width:100%;aspect-ratio:1 / 1;overflow:hidden;background:#111;
  position:relative;
}
.img-wrap img{
  width:100%;height:100%;
  object-fit:cover; /* PERFECT FIT */
  object-position:center top;
  display:block;transition:transform 0.4s ease;
}
.product-card:hover.img-wrap img{transform:scale(1.06)}
.product-card h3{font-size:9px;margin:10px 6px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:0.5px;font-weight:800}
.price{color:var(--red);font-size:13px;font-weight:900;margin-bottom:8px}
.view-btn{
  width:calc(100% - 12px);background:rgba(225,6,0,0.92);
  backdrop-filter:blur(10px);color:#fff;
  border:1px solid rgba(255,255,255,0.15);
  padding:11px;border-radius:8px;font-size:10px;font-weight:900;
  margin:0 6px 8px;min-height:38px;
}

/* LAPTOP 3 PER ROW */
@media(min-width:768px){
 .products{gap:14px;padding:80px 16px 30px}
 .img-wrap{aspect-ratio:4/5}
}
@media(min-width:1024px){
 .products{grid-template-columns:repeat(3,1fr);gap:18px;padding:90px 30px;max-width:1000px}
 .nav{gap:20px}.nav a{font-size:11px}.logo{font-size:20px}
}
@media(max-width:360px){
 .products{gap:8px;padding:68px 8px 20px}
  header{padding:10px 10px}.nav{gap:8px}.nav a{font-size:9px}
}

/* GLASSY DRAWER - RIGHT SIDE REDUCED BOX */
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);backdrop-filter:blur(4px);z-index:999;opacity:0;visibility:hidden;transition:0.3s}
.drawer-overlay.active{opacity:1;visibility:visible}
.drawer{
  position:fixed;top:0;right:-100%;width:86%;max-width:340px;height:100%;
  background:rgba(10,10,10,0.82);backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
  border-left:1px solid rgba(255,255,255,0.15);
  z-index:1000;transition:right 0.38s cubic-bezier(0.32,0.72,0,1);
  display:flex;flex-direction:column;
}
.drawer.active{right:0}
.drawer-top{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,0.05);border-bottom:1px solid rgba(255,255,255,0.1)}
.drawer-top h3{font-size:11px;letter-spacing:2.5px;color:rgba(255,255,255,0.6);font-weight:800}
.close-x{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.15);color:#fff;font-size:20px;display:grid;place-items:center}
.drawer-img-wrap{background:transparent;width:100%;height:30vh;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;padding:12px 14px}
.drawer-img-wrap::-webkit-scrollbar{display:none}
.drawer-img-wrap img{width:70%;min-width:70%;height:100%;object-fit:cover;border-radius:14px;scroll-snap-align:center;border:1px solid rgba(255,255,255,0.2);background:#111}
.dots-wrap{display:flex;gap:5px;justify-content:center;padding:8px 0}
.dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,0.25);transition:0.2s}
.dot.active{background:#fff;width:16px}
.drawer-content{padding:14px 16px;flex:1;overflow-y:auto;padding-bottom:100px}
.drawer-content h2{font-size:16px;font-weight:900;margin-bottom:4px}
.d-price{color:var(--red);font-size:16px;font-weight:900;margin-bottom:14px}
.opt-title{font-size:10px;letter-spacing:2px;color:rgba(255,255,255,0.5);margin-bottom:8px;font-weight:700}
.sizes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.size-btn{padding:10px 14px;min-width:46px;border:1px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.07);color:#fff;border-radius:8px;font-weight:800;font-size:12px}
.size-btn.active{background:rgba(255,255,255,0.9);color:#000;border-color:#fff}
.qty-box{display:flex;align-items:center;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.15);border-radius:10px;width:150px;overflow:hidden;margin-bottom:18px}
.qty-btn{width:48px;height:42px;background:rgba(255,255,255,0.08);border:none;color:#fff;font-size:18px}
.qty-num{flex:1;text-align:center;font-weight:900;font-size:14px}
.btn-stack{position:absolute;bottom:0;left:0;width:100%;padding:10px;background:rgba(0,0,0,0.6);backdrop-filter:blur(18px);border-top:1px solid rgba(255,255,255,0.1);display:flex;flex-direction:column;gap:8px}
.btn-big{width:100%;padding:14px;border:none;border-radius:10px;font-weight:900;font-size:11px;border:1px solid rgba(255,255,255,0.15);min-height:46px}
.btn-cart{background:rgba(255,255,255,0.9);color:#000}
.btn-buy{background:rgba(225,6,0,0.9);color:#fff}
</style>
</head>
<body>

<header>
  <div class="logo">CRI<span>TZ</span></div>
  <div class="nav">
    <a href="index.html">HOME</a>
    <a href="products.html" class="active">SHOP</a>
    <a href="cart.html">CART <span class="cart-badge" id="nav-cart">0</span></a>
  </div>
</header>

<section class="products">
  <div class="product-card">
    <div class="img-wrap"><img src="polo.png" onerror="this.src='https://via.placeholder.com/600x600/111111/ffffff?text=CRITZ'"></div>
    <h3>CRITZ POLO</h3><div class="price">₦37,000</div><button class="view-btn" onclick="openDrawer('longsleeve')">VIEW</button>
  </div>
  <div class="product-card">
    <div class="img-wrap"><img src="sleeve2.png"></div>
    <h3>CRITZ HOODIE</h3><div class="price">₦40,000</div><button class="view-btn" onclick="openDrawer('hoodie')">VIEW</button>
  </div>
  <div class="product-card">
    <div class="img-wrap"><img src="jorts.png"></div>
    <h3>SLEEVELESS</h3><div class="price">₦25,000</div><button class="view-btn" onclick="openDrawer('sleeveless')">VIEW</button>
  </div>
  <div class="product-card">
    <div class="img-wrap"><img src="jorts2.png"></div>
    <h3>LONG SLEEVE TEE</h3><div class="price">₦35,000</div><button class="view-btn" onclick="openDrawer('longsleeve')">VIEW</button>
  </div>
  <div class="product-card">
    <div class="img-wrap"><img src="tees.png"></div>
    <h3>CRITZ HOODIE</h3><div class="price">₦40,000</div><button class="view-btn" onclick="openDrawer('hoodie')">VIEW</button>
  </div>
  <div class="product-card">
    <div class="img-wrap"><img src="tees2.png"></div>
    <h3>SLEEVELESS</h3><div class="price">₦25,000</div><button class="view-btn" onclick="openDrawer('sleeveless')">VIEW</button>
  </div>
</section>

<div class="drawer-overlay" id="overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-top"><h3>SELECT OPTIONS</h3><button class="close-x" onclick="closeDrawer()">✕</button></div>
  <div class="drawer-img-wrap" id="drawer-images"></div>
  <div class="dots-wrap" id="dots"></div>
  <div class="drawer-content">
    <h2 id="drawer-title"></h2>
    <div class="d-price" id="drawer-price"></div>
    <div class="opt-title" id="size-label">SIZE: M</div>
    <div class="sizes" id="size-options"></div>
    <div class="qty-box"><button class="qty-btn" onclick="changeQty(-1)">−</button><div class="qty-num" id="qty">1</div><button class="qty-btn" onclick="changeQty(1)">+</button></div>
  </div>
  <div class="btn-stack">
    <button class="btn-big btn-cart" onclick="addToCartFromDrawer()">ADD TO CART</button>
    <button class="btn-big btn-buy" onclick="buyNow()">BUY IT NOW</button>
  </div>
</div>

<script>
const products={
  longsleeve:{title:"LONG SLEEVE TEE",price:35000,images:["polo.png","polopic.jpeg"],sizes:["M","L","XL","XXL"]},
  hoodie:{title:"CRITZ HOODIE",price:40000,images:["hoodie.png","hoodie-back.png"],sizes:["M","L","XL","XXL"]},
  sleeveless:{title:"GRAPHIC SLEEVELESS TEE",price:25000,images:["harmlesstee.png","harmlesstee-back.png"],sizes:["M","L","XL"]}
};
let currentProduct=null,selectedSize=null,qty=1;
function updateNavCart(){let c=JSON.parse(localStorage.getItem('stylevaultCart'))||[];document.getElementById('nav-cart').innerText=c.reduce((s,i)=>s+i.qty,0)}
function openDrawer(id){
 currentProduct=products[id];selectedSize=currentProduct.sizes[0];qty=1;
 document.getElementById('drawer-title').innerText=currentProduct.title;
 document.getElementById('drawer-price').innerText=`₦${currentProduct.price.toLocaleString()}.00`;
 document.getElementById('qty').innerText=qty;
 const imgDiv=document.getElementById('drawer-images');imgDiv.innerHTML='';
 currentProduct.images.forEach(img=>{imgDiv.innerHTML+=`<img src="${img}" onerror="this.src='https://via.placeholder.com/600x600/111/fff?text=CRITZ'">`;});
 const dotsDiv=document.getElementById('dots');dotsDiv.innerHTML='';
 currentProduct.images.forEach((_,k)=>{dotsDiv.innerHTML+=`<div class="dot ${k===0?'active':''}"></div>`;});
 imgDiv.onscroll=()=>{let i=Math.round(imgDiv.scrollLeft/(imgDiv.clientWidth*0.7));document.querySelectorAll('.dot').forEach((d,idx)=>d.classList.toggle('active',idx===i));};
 const sizeDiv=document.getElementById('size-options');sizeDiv.innerHTML='';
 currentProduct.sizes.forEach((s,i)=>{sizeDiv.innerHTML+=`<button class="size-btn ${i===0?'active':''}" onclick="selectSize('${s}',this)">${s}</button>`;});
 document.getElementById('size-label').innerText=`SIZE: ${selectedSize}`;
 document.body.classList.add('no-scroll');document.getElementById('overlay').classList.add('active');document.getElementById('drawer').classList.add('active');
}
function closeDrawer(){document.body.classList.remove('no-scroll');document.getElementById('overlay').classList.remove('active');document.getElementById('drawer').classList.remove('active')}
function selectSize(s,el){selectedSize=s;document.querySelectorAll('.size-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');document.getElementById('size-label').innerText=`SIZE: ${selectedSize}`}
function changeQty(v){qty=Math.max(1,qty+v);document.getElementById('qty').innerText=qty}
function addToCartFromDrawer(){let cart=JSON.parse(localStorage.getItem('stylevaultCart'))||[];let key=currentProduct.title+'-'+selectedSize;let ex=cart.find(i=>i.key===key);if(ex)ex.qty+=qty;else cart.push({key,name:currentProduct.title,size:selectedSize,price:currentProduct.price,img:currentProduct.images[0],qty});localStorage.setItem('stylevaultCart',JSON.stringify(cart));updateNavCart();closeDrawer()}
function buyNow(){addToCartFromDrawer();setTimeout(()=>location.href='cart.html',200)}
updateNavCart();
</script>
</body>
</html>
