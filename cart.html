<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CART - CRITZ</title>
<style>
:root{--red:#e10600}
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{
  background:#000 url('background.jpg') no-repeat center center fixed;
  background-size:cover;color:#fff;min-height:100vh;
}
body::before{content:"";position:fixed;inset:0;background:rgba(0,0,0,0.70);z-index:-1}

/* GLASSY NAV */
header{
  position:fixed;top:0;width:100%;padding:14px 16px;
  display:flex;justify-content:space-between;align-items:center;z-index:10;
  background:rgba(0,0,0,0.35);backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(255,255,255,0.12);
}
.logo{font-size:20px;font-weight:900}.logo span{color:var(--red)}
.nav{display:flex;gap:16px}.nav a{color:#fff;text-decoration:none;font-size:11px;font-weight:800}

.wrap{padding:75px 12px 30px;max-width:700px;margin:0 auto;position:relative;z-index:1}
.title{font-size:22px;font-weight:900;margin-bottom:4px;letter-spacing:1px}
.sub{font-size:11px;color:rgba(255,255,255,0.5);margin-bottom:18px;letter-spacing:1px}

/* GLASSY CART ITEM */
.cart-item{
  background:rgba(15,15,15,0.45);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,0.15);
  border-radius:14px;
  display:flex;gap:12px;padding:12px;margin-bottom:10px;
  box-shadow:0 8px 32px rgba(0,0,0,0.4);
}
.cart-item img{
  width:80px;height:80px;object-fit:contain;
  background:rgba(255,255,255,0.92);border-radius:10px;
  border:1px solid rgba(255,255,255,0.2);
}
.cart-info{flex:1}
.cart-info h3{font-size:12px;font-weight:800;margin-bottom:3px}
.cart-info p{font-size:10px;color:rgba(255,255,255,0.5);margin-bottom:6px}
.cart-price{color:var(--red);font-weight:900;font-size:14px}
.qty-row{display:flex;align-items:center;gap:8px;margin-top:8px}
.q-btn{
  width:32px;height:32px;border-radius:8px;
  background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);
  color:#fff;font-size:16px;backdrop-filter:blur(10px);
}
.q-num{font-size:13px;font-weight:800;min-width:20px;text-align:center}
.remove{
  background:rgba(225,6,0,0.15);border:1px solid rgba(225,6,0,0.3);
  color:var(--red);padding:6px 10px;border-radius:8px;
  font-size:10px;font-weight:800;margin-left:auto;backdrop-filter:blur(10px);
}

/* GLASSY SUMMARY */
.summary{
  margin-top:20px;
  background:rgba(15,15,15,0.45);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,0.15);
  border-radius:16px;padding:16px;
  box-shadow:0 8px 32px rgba(0,0,0,0.5);
}
.row{display:flex;justify-content:space-between;font-size:12px;margin-bottom:10px;color:rgba(255,255,255,0.7)}
.row.total{font-size:16px;font-weight:900;color:#fff;border-top:1px solid rgba(255,255,255,0.1);padding-top:12px;margin-top:8px}
.checkout{
  width:100%;margin-top:14px;padding:16px;
  background:rgba(225,6,0,0.9);backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,0.15);
  color:#fff;border-radius:12px;font-weight:900;font-size:12px;letter-spacing:1px;
  box-shadow:0 4px 20px rgba(225,6,0,0.4);
}
.continue{
  width:100%;margin-top:10px;padding:14px;
  background:rgba(255,255,255,0.08);backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,0.15);
  color:#fff;border-radius:12px;font-weight:800;font-size:11px;
}
.empty{
  text-align:center;padding:60px 20px;
  background:rgba(15,15,15,0.35);backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,0.12);border-radius:16px;
}
.empty h2{font-size:16px;margin-bottom:8px}
.empty p{font-size:11px;color:rgba(255,255,255,0.5);margin-bottom:16px}
.empty a{color:var(--red);text-decoration:none;font-weight:800;font-size:12px}
</style>
</head>
<body>
<header>
  <div class="logo">CRI<span>TZ</span></div>
  <div class="nav"><a href="products.html">SHOP</a><a href="cart.html">🛍️ CART (<span id="cart-count">0</span>)</a></div>
</header>

<div class="wrap">
  <div class="title">YOUR CART</div>
  <div class="sub" id="item-count">0 ITEMS</div>
  <div id="cart-list"></div>
  <div id="summary-box" style="display:none">
    <div class="summary">
      <div class="row"><span>Subtotal</span><span id="subtotal">₦0</span></div>
      <div class="row"><span>Shipping</span><span>Calculated at checkout</span></div>
      <div class="row total"><span>Total</span><span id="total">₦0</span></div>
      <button class="checkout" onclick="checkout()">CHECKOUT</button>
      <button class="continue" onclick="location.href='products.html'">CONTINUE SHOPPING</button>
    </div>
  </div>
</div>

<script>
function loadCart(){
  let cart=JSON.parse(localStorage.getItem('stylevaultCart'))||[];
  document.getElementById('cart-count').innerText=cart.reduce((s,i)=>s+i.qty,0);
  document.getElementById('item-count').innerText=cart.length+' ITEMS';
  const list=document.getElementById('cart-list');
  if(cart.length===0){
    list.innerHTML=`<div class="empty"><h2>Cart Empty</h2><p>You never add anything yet</p><a href="products.html">GO TO SHOP →</a></div>`;
    document.getElementById('summary-box').style.display='none';
    return;
  }
  list.innerHTML='';
  let sub=0;
  cart.forEach((item,idx)=>{
    sub+=item.price*item.qty;
    list.innerHTML+=`
    <div class="cart-item">
      <img src="${item.img}" onerror="this.src='https://via.placeholder.com/200/ffffff/000000?text=CRITZ'">
      <div class="cart-info">
        <h3>${item.name}</h3>
        <p>SIZE: ${item.size}</p>
        <div class="cart-price">₦${item.price.toLocaleString()}</div>
        <div class="qty-row">
          <button class="q-btn" onclick="changeQty(${idx},-1)">−</button>
          <div class="q-num">${item.qty}</div>
          <button class="q-btn" onclick="changeQty(${idx},1)">+</button>
          <button class="remove" onclick="removeItem(${idx})">REMOVE</button>
        </div>
      </div>
    </div>`;
  });
  document.getElementById('subtotal').innerText=`₦${sub.toLocaleString()}`;
  document.getElementById('total').innerText=`₦${sub.toLocaleString()}`;
  document.getElementById('summary-box').style.display='block';
}
function changeQty(i,d){
  let cart=JSON.parse(localStorage.getItem('stylevaultCart'))||[];
  cart[i].qty=Math.max(1,cart[i].qty+d);
  localStorage.setItem('stylevaultCart',JSON.stringify(cart));
  loadCart();
}
function removeItem(i){
  let cart=JSON.parse(localStorage.getItem('stylevaultCart'))||[];
  cart.splice(i,1);
  localStorage.setItem('stylevaultCart',JSON.stringify(cart));
  loadCart();
}
function checkout(){
  alert('Checkout - connect your Paystack/Flutterwave here');
  // location.href='checkout.html'
}
loadCart();
</script>
</body>
</html>
