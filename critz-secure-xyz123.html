<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADMIN - CRITZ</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,Arial}
body{background:#0a0a0a;color:#fff;min-height:100vh}
#lockScreen{position:fixed;inset:0;background:#000 url('background.jpg') no-repeat center center fixed;background-size:cover;display:grid;place-items:center;z-index:9999}
#lockScreen::before{content:"";position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:-1}
.lockBox{background:rgba(18,18,18,0.85);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.14);border-radius:18px;padding:22px;width:90%;max-width:340px;text-align:center}
.lockBox h2{font-size:16px;margin-bottom:6px;letter-spacing:2px}.lockBox h2 span{color:#e10600}
.lockBox p{font-size:11px;color:#777;margin-bottom:16px}
.lockBox input{width:100%;padding:14px;background:#000;border:1px solid #333;border-radius:10px;color:#fff;font-size:15px;outline:none;margin-bottom:12px;text-align:center;letter-spacing:2px}
.lockBox button{width:100%;padding:14px;background:#e10600;border:none;border-radius:10px;color:#fff;font-weight:900;font-size:11px;letter-spacing:1px}
.error{color:#ff4444;font-size:11px;margin-top:8px;display:none}

#adminContent{display:none;padding:12px;max-width:800px;margin:0 auto}
h1{font-size:18px;margin-bottom:4px}h1 span{color:#e10600}
.sub{font-size:10px;color:#666;margin-bottom:12px}
.topbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.btn{padding:10px 12px;border-radius:10px;border:1px solid #333;background:#111;color:#fff;font-weight:800;font-size:10px;min-height:38px}
.btn-wa{background:#25D366;border-color:#25D366;color:#fff}
.btn-del{background:#e10600;border-color:#e10600}
.search{width:100%;padding:12px;background:#111;border:1px solid #222;border-radius:10px;color:#fff;font-size:13px;margin-bottom:12px;outline:none}
.order{background:#111;border:1px solid #222;border-radius:16px;padding:12px;margin-bottom:12px}
.badge{padding:4px 8px;border-radius:20px;font-size:9px;font-weight:900;display:inline-block;margin-right:4px}
.badge-paid{background:#00c853;color:#000}.badge-delivery{background:#25D366;color:#000}.badge-pickup{background:#fff;color:#000}.badge-unpaid{background:#ffab00;color:#000}
.id{color:#e10600;font-weight:900;font-size:12px}.date{font-size:10px;color:#555;margin:4px 0}.ref{font-size:10px;color:#666;word-break:break-all}
.cust{background:#181818;padding:10px;border-radius:10px;margin:8px 0;font-size:12px;line-height:1.7}
.item{font-size:11px;color:#aaa;margin:3px 0;display:flex;justify-content:space-between}
.total{font-weight:900;margin-top:8px;border-top:1px solid #222;padding-top:8px;display:flex;justify-content:space-between;font-size:13px}
.total span:last-child{color:#e10600}
</style>
</head>
<body>

<div id="lockScreen">
  <div class="lockBox">
    <h2>CRI<span>TZ</span> ADMIN</h2>
    <p>Enter password to view orders</p>
    <input type="password" id="passInput" placeholder="PASSWORD" onkeypress="if(event.key==='Enter')checkPass()">
    <button onclick="checkPass()">UNLOCK</button>
    <div class="error" id="error">Wrong password!</div>
    <p style="margin-top:12px;font-size:9px;color:#444">Default: CRITZ2024 - change in code</p>
  </div>
</div>

<div id="adminContent">
  <h1>CRI<span>TZ</span> ADMIN</h1>
  <div class="sub">Total <span id="count">0</span> orders | Paid: <span id="paidCount">0</span> | Revenue: ₦<span id="revenue">0</span> | <a href="#" onclick="logout()" style="color:#e10600;text-decoration:none">LOGOUT</a></div>
  <div class="topbar">
    <button class="btn" onclick="location.reload()">REFRESH</button>
    <button class="btn" onclick="exportCSV()">EXPORT CSV</button>
    <button class="btn btn-del" onclick="if(confirm('Delete ALL?')){localStorage.removeItem('critzOrders');location.reload()}">CLEAR ALL</button>
  </div>
  <input type="text" id="search" class="search" placeholder="Search name, phone, state, ID..." oninput="render()">
  <div id="list"></div>
</div>

<script>
// ===== CHANGE YOUR PASSWORD HERE =====
const ADMIN_PASSWORD = 'Abdullahi2009';
// =====================================

function checkPass(){
  let p=document.getElementById('passInput').value;
  if(p===ADMIN_PASSWORD){
    localStorage.setItem('critzAdminAuth','true');
    document.getElementById('lockScreen').style.display='none';
    document.getElementById('adminContent').style.display='block';
    render();
  } else {
    document.getElementById('error').style.display='block';
    document.getElementById('passInput').value='';
  }
}
function logout(){localStorage.removeItem('critzAdminAuth');location.reload()}
// Auto login if already unlocked
if(localStorage.getItem('critzAdminAuth')==='true'){
  document.getElementById('lockScreen').style.display='none';
  document.getElementById('adminContent').style.display='block';
}

let allOrders = JSON.parse(localStorage.getItem('critzOrders')||'[]');
function render(){
  let q=document.getElementById('search').value.toLowerCase();
  let orders=allOrders.filter(o=>`${o.id} ${o.customer.fullName} ${o.customer.phone} ${o.customer.email} ${o.state}`.toLowerCase().includes(q));
  document.getElementById('count').innerText=allOrders.length;
  document.getElementById('paidCount').innerText=allOrders.filter(o=>o.status==='PAID').length;
  document.getElementById('revenue').innerText=allOrders.filter(o=>o.status==='PAID').reduce((s,o)=>s+o.total,0).toLocaleString();
  let list=document.getElementById('list');list.innerHTML='';
  if(orders.length===0){list.innerHTML='<p style="color:#555;text-align:center;margin-top:20px">No orders</p>';return;}
  orders.forEach((o)=>{
    let idx=allOrders.indexOf(o);
    let paidBadge=o.status==='PAID'?`<span class="badge badge-paid">PAID ✅</span>`:`<span class="badge badge-unpaid">UNPAID</span>`;
    let modeBadge=o.mode==='DELIVERY'?`<span class="badge badge-delivery">${o.mode} - ${o.state} - ₦${o.shipFee.toLocaleString()}</span>`:`<span class="badge badge-pickup">${o.mode}</span>`;
    list.innerHTML+=`<div class="order">
      <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px"><span class="id">${o.id}</span><div>${paidBadge} ${modeBadge}</div></div>
      <div class="date">${o.date}</div><div class="ref">Ref: ${o.paystack_ref||o.id}</div>
      <div class="cust">
        Name: ${o.customer.fullName}<br>
        Phone: <a href="tel:${o.customer.phone}" style="color:#25D366;text-decoration:none">${o.customer.phone}</a> | <a href="https://wa.me/${o.customer.phone.replace(/\D/g,'')}" target="_blank" style="color:#25D366">WhatsApp</a><br>
        Email: ${o.customer.email||'None'}<br>
        State: <b style="color:#fff">${o.state}</b><br>
        Street: ${o.customer.street}<br>
        Building: ${o.customer.building}<br>
        City: ${o.customer.city}<br>
        Landmark: ${o.customer.landmark||'None'}
      </div>
      ${o.items.map(it=>`<div class="item"><span>• ${it.name} | ${it.size} x${it.qty}</span><span>₦${(it.price*it.qty).toLocaleString()}</span></div>`).join('')}
      <div class="total"><span>Sub ₦${o.subtotal.toLocaleString()} + Ship ₦${o.shipFee.toLocaleString()}</span><span>TOTAL ₦${o.total.toLocaleString()}</span></div>
      <div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn btn-wa" onclick="window.open('https://wa.me/${o.customer.phone.replace(/\D/g,'')}?text=Hello ${o.customer.fullName}, order ${o.id} confirmed - ₦${o.total.toLocaleString()}','_blank')">WHATSAPP</button>
        <button class="btn btn-del" onclick="let a=JSON.parse(localStorage.getItem('critzOrders'));a.splice(${idx},1);localStorage.setItem('critzOrders',JSON.stringify(a));location.reload()">DELETE</button>
      </div>
    </div>`;
  });
}
function exportCSV(){
  let csv='ID,Ref,Date,Status,Mode,State,Ship,Total,Name,Phone,Email,Street,Building,City,Landmark,Items\n';
  allOrders.forEach(o=>{
    let items=o.items.map(it=>`${it.name} ${it.size} x${it.qty}`).join('; ');
    csv+=`"${o.id}","${o.paystack_ref}","${o.date}","${o.status}","${o.mode}","${o.state}",${o.shipFee},${o.total},"${o.customer.fullName}","${o.customer.phone}","${o.customer.email}","${o.customer.street}","${o.customer.building}","${o.customer.city}","${o.customer.landmark}","${items}"\n`;
  });
  let blob=new Blob([csv],{type:'text/csv'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='critz_orders.csv';a.click();
}
</script>
</body>
</html>
